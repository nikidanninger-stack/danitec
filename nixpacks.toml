# ── Railway / Nixpacks Build-Konfiguration ────────────────────────────────────
# Stellt Node.js + Chromium (für PDF-Export) bereit

[phases.setup]
nixPkgs = ["nodejs_20", "chromium", "nss", "freetype", "harfbuzz", "ca-certificates"]

[phases.install]
cmds = [
  "npm install --prefix backend",
  "npm install --prefix frontend"
]

[phases.build]
cmds = ["npm run build --prefix frontend"]

[variables]
PUPPETEER_SKIP_DOWNLOAD = "true"
PUPPETEER_EXECUTABLE_PATH = "/run/current-system/sw/bin/chromium"
NODE_ENV = "production"

[start]
cmd = "node backend/src/server.js"

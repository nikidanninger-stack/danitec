# ── Render.com Blueprint – Danitec App ────────────────────────────────────────
services:
  - type: web
    name: danitec
    runtime: node
    buildCommand: npm install --prefix backend && npm install --prefix frontend && npm run build --prefix frontend
    startCommand: node backend/src/server.js
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: danitec-db
          property: connectionString
      - key: PUPPETEER_SKIP_DOWNLOAD
        value: "true"

databases:
  - name: danitec-db
    databaseName: danitec_db
    user: danitec_user
    plan: free
